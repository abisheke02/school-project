version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${DB_NAME:-testv3_db}
      POSTGRES_USER:     ${DB_USER:-testv3_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-testv3_password_dev}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-testv3_user} -d ${DB_NAME:-testv3_db}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 512M

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 300M

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV:            ${NODE_ENV:-production}
      PORT:                3000
      DB_HOST:             postgres
      DB_PORT:             5432
      DB_NAME:             ${DB_NAME:-testv3_db}
      DB_USER:             ${DB_USER:-testv3_user}
      DB_PASSWORD:         ${DB_PASSWORD:-testv3_password_dev}
      REDIS_URL:           redis://redis:6379
      JWT_SECRET:          ${JWT_SECRET:-testv3_jwt_secret_change_in_production}
      ALLOWED_ORIGINS:     ${ALLOWED_ORIGINS:-http://localhost:8080}
      ADMIN_USERNAME:      ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD:      ${ADMIN_PASSWORD:-admin123}
      ANTHROPIC_API_KEY:   ${ANTHROPIC_API_KEY:-}
      RAZORPAY_KEY_ID:     ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-}
      FIREBASE_CLIENT_EMAIL: ${FIREBASE_CLIENT_EMAIL:-}
      FIREBASE_PRIVATE_KEY: ${FIREBASE_PRIVATE_KEY:-}
      SUPABASE_URL:        ${SUPABASE_URL:-}
      SUPABASE_ANON_KEY:   ${SUPABASE_ANON_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M

volumes:
  postgres_data:
  redis_data:

networks:
  default:
    name: testv3_network
